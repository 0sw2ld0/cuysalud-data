name: Validar y publicar datos
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 14 * * *"
permissions:
  contents: read
concurrency:
  group: cuysalud-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: etl/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r etl/requirements.txt
      - run: PYTHONPATH=etl pytest -q etl/tests
      - name: Obtener ediciones públicas enlazadas
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python etl/refresh.py
      - run: python etl/audit_pricing.py
      - name: Validar snapshot antes de guardar
        run: node scripts/build.mjs
      - name: Guardar nueva edición validada
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if ! git diff --quiet -- data; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data
            git commit -m 'Actualizar ediciones oficiales verificadas'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        with:
          name: evidencia-fuentes-oficiales
          path: evidence/
          retention-days: 30
          if-no-files-found: ignore
  build:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build.mjs
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
